name: Check translations and categories
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  data-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test public catalog data
        run: python3 -m unittest discover -p 'test_*.py' -v
      - name: Verify build input hashes
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          for name, expected in json.loads(Path('input-sha256.json').read_text()).items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'Input digest mismatch: {name}')
          PY
